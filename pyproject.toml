[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "migrations",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]  # длина строки контролирует black; не шумим в редакторе

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E402", "F401", "F403"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"