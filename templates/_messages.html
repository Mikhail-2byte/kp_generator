{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-container">
      {% for category, message in messages %}
        {% set variant = 'error' if category in ['error', 'danger'] else 'success' if category == 'success' else 'info' %}
        <div class="flash flash-{{ variant }}" role="alert">
          <span class="flash-message">{{ message }}</span>
          <button type="button" class="flash-close" data-close-flash aria-label="Закрыть уведомление">{{ sidebar_icon('x')|safe }}</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
