{% extends 'base.html' %}

{% block content %}
<div class="content-container">
    <div class="card">
        <div class="card-header">
            <div>
                <h2 class="section-title">Поделитесь опытом</h2>
                <p class="section-description">Нам важно понимать, что нужно улучшить в генераторе коммерческих предложений.</p>
            </div>
        </div>
        <form method="post" novalidate class="form-grid" id="feedbackForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field-group">
                <label for="name" class="field-label">Ваше имя</label>
                <input type="text" id="name" name="name" placeholder="Аноним"
                       value="{{ form_data.name if form_data else '' }}">
            </div>
            <div class="field-group">
                <label for="contact" class="field-label">Контакт для связи</label>
                <input type="text" id="contact" name="contact" placeholder="Email или телефон"
                       value="{{ form_data.contact if form_data else '' }}">
            </div>
            <div class="field-group span-3">
                <label for="feedback_text" class="field-label">Что понравилось</label>
                <textarea id="feedback_text" name="feedback_text" rows="4" placeholder="Расскажите, что работает хорошо и что стоит сохранить.">{{ form_data.feedback_text if form_data else '' }}</textarea>
            </div>
            <div class="field-group span-3">
                <label for="improvement_text" class="field-label">Что можно улучшить</label>
                <textarea id="improvement_text" name="improvement_text" rows="4" placeholder="Поделитесь идеями, которые сделают сервис удобнее.">{{ form_data.improvement_text if form_data else '' }}</textarea>
            </div>

            <div class="controls-row">
                <p class="muted-text">Если заполнить хотя бы одно поле отзыва, мы сможем оперативно реагировать.</p>
                <button type="submit" class="btn btn-primary">Отправить отзыв</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const nameField = document.getElementById('name');
        if (nameField) {
            nameField.focus();
        }
    });
</script>
{% endblock %}
